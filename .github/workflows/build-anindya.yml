name: Build ANINDYA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ANINDYA_APK_SOURCE_SINGLE_UPLOAD.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ANINDYA ZIP
        run: |
          unzip -q ANINDYA_APK_SOURCE_SINGLE_UPLOAD.zip -d extracted
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build ANINDYA APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANINDYA-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
