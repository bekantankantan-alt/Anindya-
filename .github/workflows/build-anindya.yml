name: Build ANINDYA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ANINDYA_APK_SOURCE_SINGLE_UPLOAD_FIX.zip'
      - '.github/workflows/build-anindya.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: test -f ANINDYA_APK_SOURCE_SINGLE_UPLOAD_FIX.zip

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q ANINDYA_APK_SOURCE_SINGLE_UPLOAD_FIX.zip -d extracted
          PROJECT_DIR=$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project tidak ditemukan!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANINDYA-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
